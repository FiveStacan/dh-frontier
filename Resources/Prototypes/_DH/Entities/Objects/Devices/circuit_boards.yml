- type: entity
  id: ExperimentalAmmoTechFabCircuitboard
  parent: BaseMachineCircuitboard
  name: экспериментальный ТехФаб патронов (машинная плата)
  description: Печатная плата экспериментального ТехФаба патронов.
  components:
    - type: Sprite
      state: security
    - type: MachineBoard
      prototype: ExperimentalAmmoTechFab
      requirements:
        Capacitor: 2
        Manipulator: 1
      stackRequirements:
        Glass: 10
        Steel: 10

- type: entity
  parent: BaseMachineCircuitboard
  id: ProtolatheHyperSpeedMachineCircuitboard
  name: гиперскоростной протолат (машинная плата)
  description: Печатная плата гиперскоростного протолата.
  components:
  - type: Sprite
    state: science
  - type: MachineBoard
    prototype: ProtolatheHyperSpeed
    requirements: # Frontier
      MatterBin: 2 # Frontier stackRequirements<requirements
    tagRequirements:
      GlassBeaker:
        amount: 2
        defaultPrototype: Beaker
      Igniter:
        amount: 1
        defaultPrototype: Igniter
    stackRequirements:
      Glass: 2

