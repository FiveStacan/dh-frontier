- type: entity
  name: Desert Eagle
  parent: BaseWeaponPistol
  id: WeaponPistolDeagle
  components:
  - type: Sprite
    sprite: _DH/Objects/Weapons/Guns/Pistols/deagle/big.rsi
  - type: Item
    sprite: _DH/Objects/Weapons/Guns/Pistols/deagle/tiny.rsi
  - type: Gun
    minAngle: 1
    maxAngle: 18
    angleIncrease: 8
    angleDecay: 9
    fireRate: 4
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: deagle
      params:
        volume: 100
    soundEmpty:
      path: /Audio/_DH/Weapons/Guns/Pistols/deagle/deagle_empty.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineDeagle
        insertSound: /Audio/_DH/Weapons/Guns/Pistols/deagle/deagle_reload.ogg
        ejectSound: /Audio/_DH/Weapons/Guns/Pistols/deagle/deagle_unload.ogg
        priority: 2
        whitelist:
          tags:
          - NFMagazinePistol45
          - MagazineMagnum
          - MagazineDeagle
      gun_chamber:
        name: Chamber
        startingItem: NFCartridgePistol45
        priority: 1
        whitelist:
          tags:
          - NFCartridgePistol45
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot

