- type: entity
  id: ProtolatheCash
  parent: BaseLathe
  name: принтер фальшивых кредитов
  description: Распечатывает "фальшивые", неофициальные кредиты, в обход систем и бюррократии, за счет бумаги и некоторых связных материалов. Открывает путь в мир фальшивомонетчиков!
  components:
  - type: Sprite
    sprite: _DH/Structures/Machines/protoprint.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: ProtolatheCashMachineCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
        - Document
        - RawMaterial
        - SheetPaper
  - type: Lathe
    producingSound: /Audio/Machines/scanning.ogg
    idleState: icon
    runningState: building
    staticPacks:
    - BackmenCash
  - type: EmagLatheRecipes
    emagStaticPacks:
    - BackmenCashEmag

