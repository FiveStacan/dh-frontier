    - Chemistry
    - Janitor
    - Instruments
    - Equipment
    - FauxTiles
    - NFMedical # Frontier
    - NFEngineering # Frontier
    - NFHardsuits # Frontier
    - NFService # Frontier
    - NFScience # Frontier
    - NFPouches # Frontier
    - DHSyndicate
    # WD EDIT START
    - VisionGoggles
    # WD EDIT END
    - SyringeGuns
    - NfsdAmmoStatic # Frontier: SecurityAmmo<NfsdAmmoStatic
    - SecurityExplosives
