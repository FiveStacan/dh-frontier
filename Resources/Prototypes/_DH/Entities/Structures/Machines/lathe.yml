
- type: entity
  id: ExperimentalAmmoTechFab
  parent: [ NFBlueprintReceiverBase, SecurityTechFab ]
  name: экспериментальный ТехФаб патронов
  description: Печатает тот минимум боеприпасов, который может понадобиться бюджетной армии или арсеналу. Так же может подключаться к РнД серверам для печати особых патронов.
  components:
  - type: MaterialStorage
    whitelist: # Frontier
      tags: # Frontier
        - Sheet # Frontier
        - RawMaterial # Frontier
        - Ingot # Frontier
        - DHMaterials
  - type: Sprite
    sprite: _DH/Structures/Machines/techfab.rsi
    snapCardinals: true # Frontier
    layers:
      - state: icon
        map: ["enum.LatheVisualLayers.IsRunning"]
      - state: ammo
      - state: unlit
        shader: unshaded
        map: ["enum.PowerDeviceVisualLayers.Powered"]
      - state: inserting
        map: ["enum.MaterialStorageVisualLayers.Inserting"]
      - state: panel
        map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: ExperimentalAmmoTechFabCircuitboard
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - GoobWeaponAmmo
    - N14AmmoPack
    - RMCAmmoPack
    - NfsdAmmoStatic
    - RMCAmmoPack
    dynamicPacks:
    - DHIncendiaryUraniumAmmoBig
    - DHIncendiaryUraniumAmmo
    - DHReseachedAmmo
  - type: BlueprintReceiver
    whitelist:
      tags:
      - NFBlueprintNfsdTechfab
      - NFBlueprintMercenaryTechfab
  - type: OreSiloClient

