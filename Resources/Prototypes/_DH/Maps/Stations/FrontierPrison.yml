- type: gameMap
  id: FrontierPrison
  mapName: 'Space Prison'
  mapPath: /Maps/_Lua/Maps/Nordfoll.yml #/Maps/_DH/Stations/FrontierPrison.yml #/Maps/_Lua/Maps/Nordfoll.yml
  minPlayers: 0 #DH потом будет от 30-50
  maxPlayers: 100
  randomRotation: false
  maxRandomOffset: 0
  isGrid: true
  stations:
    FrontierPrison:
      stationProto: StandardFrontierStation
      components:
        - type: MailStationDisabled
        - type: StationNameSetup
          mapNameTemplate: 'Космическая Тюрьма'
        - type: StationJobs
          availableJobs:
            OutpostSyndicateResearcher: [ 0, 4 ]
          #  PermaPrisoner: [ 3, 3 ]
          #  HeadOfPrison: [ 1, 1 ]
          #  DHPrisonGuard: [ 6, 6 ]
          #  PrisonDoctor: [ 3, 3 ]
        - type: ExtraStationInformation
          iconPath: /Textures/Structures/Wallmounts/flags.rsi/syndie_flag.png #/Textures/_DH/Structures/Storage/kvass.rsi/kvass.png 
          stationSubtext: 'prison-lobby-outpost-subtext'
          stationDescription: 'prison-lobby-outpost-description'