- type: entity
  abstract: true
  parent: [Clothing, RecyclableItemClothBasic] # Frontier: added RecyclableItemClothBasic
  id: UnsensoredClothingUniformBase
  components:
  - type: Sprite
    state: icon
  - type: StaticPrice #DH
    price: 35
  - type: Armor #DH
    modifiers:
      coefficients:
        Blunt: 0.99
        Slash: 0.99
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 0.99
  - type: Clothing
    equipDelay: 1.4 #DH
    unequipDelay: 1
    slots: [innerclothing]
    equipSound:
      path: /Audio/Items/jumpsuit_equip.ogg
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 3
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 150
  - type: Food
    requiresSpecialDigestion: true
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Fiber
          Quantity: 30
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon

- type: entity
  abstract: true
  parent: UnsensoredClothingUniformBase
  id: UnsensoredClothingUniformSkirtBase
  components:
  - type: Clothing
    slots: [innerclothing]
    femaleMask: UniformTop

- type: entity
  abstract: true
  parent: UnsensoredClothingUniformBase
  id: ClothingUniformBase
  components:
  - type: SuitSensor
  - type: DeviceNetwork
    deviceNetId: Wireless
    transmitFrequencyId: SuitSensor
    savableAddress: false
  # - type: WirelessNetworkConnection # Frontier - Remove range for long space sensors
  #   range: 1200 # Frontier - Remove range for long space sensors
  # - type: StationLimitedNetwork # Frontier - Remove range for long space sensors
  #DH
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DH/Items/Handling/cloth_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DH/Items/Handling/cloth_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DH/Items/Handling/cloth_drop.ogg
  #DH

- type: entity
  abstract: true
  parent: ClothingUniformBase
  id: ClothingUniformSkirtBase
  components:
  - type: Clothing
    slots: [innerclothing]
    femaleMask: UniformTop
