- type: entity
  parent: ClothingShoesBootsMagSyndie
  id: ClothingShoesBootsJetBoots
  name: jump boots
  description: One moment and you are already here.
  components:
  - type: Sprite
    sprite: Corvax/Clothing/Shoes/Boots/jetboots.rsi
    state: icon
  - type: Clothing
    sprite: Corvax/Clothing/Shoes/Boots/jetboots.rsi
  - type: Magboots
  - type: ClothingSpeedModifier
    walkModifier: 0.90
    sprintModifier: 0.90
  - type: NoSlip
  - type: StaticPrice
    price: 1650

- type: entity
  id: ActionToggleJetBoots
  parent: ActionToggleMagboots
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: { sprite: Corvax/Clothing/Shoes/Boots/jetboots.rsi, state: icon }
    iconOn:
      sprite: Corvax/Clothing/Shoes/Boots/jetboots.rsi
      state: icon-on
